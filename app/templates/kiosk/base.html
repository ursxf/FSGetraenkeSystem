<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FS Getränkesystem{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .kiosk-card {
      background: rgba(255,255,255,0.97);
      border-radius: 1.5rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
    }
    .drink-btn {
      border-radius: 1rem;
      font-size: 1.1rem;
      padding: 1rem;
      transition: transform .1s;
    }
    .drink-btn:active { transform: scale(0.97); }
    .balance-positive { color: #198754; font-weight: 700; }
    .balance-negative { color: #dc3545; font-weight: 700; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div class="kiosk-card p-4 p-md-5" style="width:100%; max-width:700px;">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
